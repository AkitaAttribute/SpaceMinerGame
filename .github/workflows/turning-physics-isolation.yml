name: Turning Physics Isolation

on:
  push:
    branches:
      - diagnostics/turning-physics-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  turning-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.1-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/godot-import.log; then exit 1; fi
      - name: Benchmark turning physics and ship shape updates
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s godot --headless --path . --script res://tests/turning_physics_profile.gd 2>&1 | tee /tmp/turning.log
          grep -q TURN_PROFILE_COMPLETE /tmp/turning.log
          grep TURN_PROFILE /tmp/turning.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" /tmp/turning.log; then exit 1; fi
