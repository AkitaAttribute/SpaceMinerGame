name: Windows ship-builder prototype build

on:
  push:
    branches:
      - prototype/ship-builder-first-pass
  workflow_dispatch:

concurrency:
  group: ship-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-custom-windows-template:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Space Miner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install scons==4.10.1
          scons --version

      - name: Checkout Godot 4.7.1 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 4.7.1-stable https://github.com/godotengine/godot.git godot-src

      - name: Patch Godot gamepad startup
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\tools\patch_godot_gamepad.py" "$env:GITHUB_WORKSPACE\godot-src"
          git -C godot-src diff --check
          git -C godot-src diff -- drivers/sdl/joypad_sdl.h drivers/sdl/joypad_sdl.cpp

      - name: Restore Godot SCons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: godot-4.7.1-windows-space-miner-${{ runner.arch }}-${{ hashFiles('tools/patch_godot_gamepad.py') }}
          restore-keys: |
            godot-4.7.1-windows-space-miner-${{ runner.arch }}-

      - name: Build custom Windows export template
        shell: pwsh
        run: |
          Set-Location godot-src
          scons platform=windows target=template_release arch=x86_64 vulkan=no d3d12=no angle=no accesskit=no debug_symbols=no cache_path="$env:GITHUB_WORKSPACE\.scons_cache" redirect_build_objects=no
          Get-ChildItem bin
          $gui = "bin\godot.windows.template_release.x86_64.exe"
          $console = "bin\godot.windows.template_release.x86_64.console.exe"
          if (!(Test-Path $gui)) { throw "Custom Godot GUI export template was not produced." }
          if (!(Test-Path $console)) { throw "Custom Godot console wrapper was not produced." }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\custom-template" | Out-Null
          Copy-Item $gui "$env:GITHUB_WORKSPACE\custom-template\windows_release_x86_64.exe"
          Copy-Item $console "$env:GITHUB_WORKSPACE\custom-template\windows_release_x86_64_console.exe"

      - name: Cache custom Windows template for export job
        uses: actions/cache/save@v4
        with:
          path: custom-template
          key: space-miner-windows-template-${{ github.sha }}
          enableCrossOsArchive: true

  build-windows:
    needs: build-custom-windows-template
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R /tmp/export-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Restore custom Windows template
        uses: actions/cache/restore@v4
        with:
          path: custom-template
          key: space-miner-windows-template-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Install custom Windows template
        shell: bash
        run: |
          set -euxo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp custom-template/windows_release_x86_64.exe "$template_dir/windows_release_x86_64.exe"
          cp custom-template/windows_release_x86_64_console.exe "$template_dir/windows_release_x86_64_console.exe"
          ls -lh "$template_dir/windows_release_x86_64"*.exe

      - name: Stamp embedded PR preview build number
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("project.godot")
          old = 'config/version="0.1.0"'
          new = 'config/version="0.1.%s"' % os.environ["GITHUB_RUN_NUMBER"]
          data = path.read_text(encoding="utf-8")
          if old not in data:
              raise RuntimeError("Missing embedded version setting.")
          path.write_text(data.replace(old, new, 1), encoding="utf-8")
          print(new)
          PY

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader|SPIR-V compilation failed" /tmp/godot-import.log; then
            echo "Godot reported script or shader compilation errors during import."
            exit 1
          fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 8s godot --headless --path . 2>&1 | tee /tmp/godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-runtime.log; then
            echo "Godot reported script or shader errors while starting the game."
            exit 1
          fi

      - name: Verify fresh executable supersedes old installed resource packs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/update_manager.gd").read_text()
          must_have = [
              "var installed_build := int(installed.get(\"build\", 0))",
              "var bundled_build := _embedded_build()",
              "installed_build <= bundled_build",
          ]
          for item in must_have:
              if item not in script:
                  raise SystemExit("Missing recovery compatibility check: " + item)
          print("Verified updated Windows and Android binaries ignore older PCK updates.")
          PY

      - name: Verify resource-pack compatibility with installed preview builds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("project.godot").read_text()
          if 'SimulationLoadingScreen="*' in project:
              raise SystemExit("Loading screen must not be a new ProjectSettings autoload: existing preview executables cannot receive autoload changes from PCK updates.")
          sources = [Path("scripts/main.gd").read_text(), Path("scripts/simulation.gd").read_text()]
          if any("SimulationLoadingScreen." in source for source in sources):
              raise SystemExit("Found direct singleton references incompatible with installed preview builds.")
          print("Validated: loading overlay created dynamically; no new autoload dependency.")
          PY

      - name: Simulation smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 35s godot --headless --path . -- --simulation-smoke 2>&1 | tee /tmp/godot-simulation.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call|Invalid access|Condition .* is true|ERROR:" /tmp/godot-simulation.log; then
            echo "Godot reported errors while exercising the mining simulation."
            exit 1
          fi
          if ! grep -F "SIM_LOADING_READY asteroids=420" /tmp/godot-simulation.log; then
            echo "Simulation never completed initial asteroid and material loading."
            exit 1
          fi

      - name: Final-voxel mining and reservation regression test
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s godot --headless --path . --script res://tests/mining_last_cell_smoke.gd 2>&1 | tee /tmp/last-cell-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call|Invalid access|ERROR:" /tmp/last-cell-test.log; then
            echo "Godot reported an error during the final-voxel mining test."
            exit 1
          fi
          if ! grep -F "LAST_CELL_SMOKE_PASS" /tmp/last-cell-test.log; then
            echo "Final-voxel mining regression test did not complete."
            exit 1
          fi

      - name: Export Windows executable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/SpaceMinerGame.exe 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-export.log; then
            echo "Godot reported script or shader errors during export."
            exit 1
          fi
          test -s build/SpaceMinerGame.exe
          ls -lh build/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMinerGame-Windows-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14

      - name: Restore persistent Android development signing key
        id: android-signing-cache
        uses: actions/cache/restore@v4
        with:
          path: .android-signing
          key: space-miner-android-development-signing-v1

      - name: Create Android development signing key once
        if: steps.android-signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .android-signing
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore .android-signing/space-miner-development.keystore \
            -storepass android \
            -alias spaceminerdevelopment \
            -keypass android \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=Space Miner Development,O=AkitaAttribute,C=US"

      - name: Save Android development signing key
        if: steps.android-signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .android-signing
          key: space-miner-android-development-signing-v1

      - name: Verify Android signing identity
        shell: bash
        run: |
          set -euxo pipefail
          test -s .android-signing/space-miner-development.keystore
          "$JAVA_HOME/bin/keytool" -list -v \
            -keystore .android-signing/space-miner-development.keystore \
            -storepass android \
            -alias spaceminerdevelopment \
            | grep -E "Alias name:|SHA256:|Valid from:"

      - name: Set Android build version
        shell: bash
        run: |
          set -euxo pipefail
          version_code="${GITHUB_RUN_NUMBER}"
          version_name="0.1.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/^version\/code=[0-9]+$/version\/code=${version_code}/" export_presets.cfg
          sed -i -E "s/^version\/name=\"[^\"]*\"$/version\/name=\"${version_name}\"/" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android-signing/space-miner-development.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: spaceminerdevelopment
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SpaceMinerGame-Android.apk 2>&1 | tee /tmp/godot-android-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-android-export.log; then
            echo "Godot reported errors during Android export."
            exit 1
          fi
          test -s build/SpaceMinerGame-Android.apk
          ls -lh build/SpaceMinerGame-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMinerGame-Android-${{ github.sha }}
          path: build/SpaceMinerGame-Android.apk
          if-no-files-found: error
          retention-days: 14

      # The normal Actions artifacts require GitHub authentication. Publish
      # downloadable resource packs and a small version manifest as release
      # assets so the installed Android/Windows game can check anonymously.
      - name: Export resource packs for in-place updates
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-pack "Windows Desktop" build/SpaceMinerGame-Windows.pck
          godot --headless --path . --export-pack "Android" build/SpaceMinerGame-Android.pck
          test -s build/SpaceMinerGame-Windows.pck
          test -s build/SpaceMinerGame-Android.pck
          ls -lh build/*.pck

      - name: Create PR preview update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = "https://github.com/AkitaAttribute/SpaceMinerGame/releases/download/pr-1-preview"
          build_dir = Path("build")
          manifest = {
              "channel": "pr-1",
              "build": int(os.environ["GITHUB_RUN_NUMBER"]),
              "commit": os.environ["GITHUB_SHA"],
          }
          for platform, filename in [
              ("windows", "SpaceMinerGame-Windows.pck"),
              ("android", "SpaceMinerGame-Android.pck"),
          ]:
              path = build_dir / filename
              manifest[platform] = {
                  "url": f"{base}/{filename}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }
          (build_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish public PR preview resource packs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=pr-1-preview
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Space Miner PR #1 Preview Updates" \
              --notes "Automatically refreshed Godot resource packs for the open development PR. Install the current Windows or Android build once to enable in-app patches."
          fi
          gh release upload "$tag" \
            build/SpaceMinerGame-Windows.pck \
            build/SpaceMinerGame-Android.pck \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Upload the manifest last, only once both downloadable packs exist.
          gh release upload "$tag" build/manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Publish complete reinstallable builds as a recovery route when a
          # bad PCK prevents the in-app updater from opening. Android uses the
          # persistent signing key and ascending versionCode, allowing an
          # in-place update that preserves user:// saves and settings.
          gh release upload "$tag" \
            build/SpaceMinerGame.exe \
            build/SpaceMinerGame-Android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
