name: Windows ship-builder prototype build

on:
  push:
    branches:
      - prototype/ship-builder-first-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-custom-windows-template:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Space Miner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install scons==4.10.1
          scons --version

      - name: Checkout Godot 4.7.1 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 4.7.1-stable https://github.com/godotengine/godot.git godot-src

      - name: Patch Godot gamepad startup
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\tools\patch_godot_gamepad.py" "$env:GITHUB_WORKSPACE\godot-src"
          git -C godot-src diff --check
          git -C godot-src diff -- drivers/sdl/joypad_sdl.h drivers/sdl/joypad_sdl.cpp

      - name: Restore Godot SCons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: godot-4.7.1-windows-space-miner-${{ runner.arch }}-${{ hashFiles('tools/patch_godot_gamepad.py') }}
          restore-keys: |
            godot-4.7.1-windows-space-miner-${{ runner.arch }}-

      - name: Build custom Windows export template
        shell: pwsh
        run: |
          Set-Location godot-src
          scons platform=windows target=template_release arch=x86_64 vulkan=no d3d12=no angle=no accesskit=no debug_symbols=no cache_path="$env:GITHUB_WORKSPACE\.scons_cache" redirect_build_objects=no
          Get-ChildItem bin
          $gui = "bin\godot.windows.template_release.x86_64.exe"
          $console = "bin\godot.windows.template_release.x86_64.console.exe"
          if (!(Test-Path $gui)) { throw "Custom Godot GUI export template was not produced." }
          if (!(Test-Path $console)) { throw "Custom Godot console wrapper was not produced." }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\custom-template" | Out-Null
          Copy-Item $gui "$env:GITHUB_WORKSPACE\custom-template\windows_release_x86_64.exe"
          Copy-Item $console "$env:GITHUB_WORKSPACE\custom-template\windows_release_x86_64_console.exe"

      - name: Upload custom Windows template
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMinerGodot-Windows-Template
          path: custom-template/*
          if-no-files-found: error
          retention-days: 2

  build-windows:
    needs: build-custom-windows-template
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R /tmp/export-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Download custom Windows template
        uses: actions/download-artifact@v4
        with:
          name: SpaceMinerGodot-Windows-Template
          path: /tmp/space-miner-template

      - name: Install custom Windows template
        shell: bash
        run: |
          set -euxo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp /tmp/space-miner-template/windows_release_x86_64.exe "$template_dir/windows_release_x86_64.exe"
          cp /tmp/space-miner-template/windows_release_x86_64_console.exe "$template_dir/windows_release_x86_64_console.exe"
          ls -lh "$template_dir/windows_release_x86_64"*.exe

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader|SPIR-V compilation failed" /tmp/godot-import.log; then
            echo "Godot reported script or shader compilation errors during import."
            exit 1
          fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 8s godot --headless --path . 2>&1 | tee /tmp/godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-runtime.log; then
            echo "Godot reported script or shader errors while starting the game."
            exit 1
          fi

      - name: Simulation smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 10s godot --headless --path . -- --simulation-smoke 2>&1 | tee /tmp/godot-simulation.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call|Invalid access|Condition .* is true|ERROR:" /tmp/godot-simulation.log; then
            echo "Godot reported errors while exercising the mining simulation."
            exit 1
          fi

      - name: Export Windows executable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/SpaceMinerGame.exe 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-export.log; then
            echo "Godot reported script or shader errors during export."
            exit 1
          fi
          test -s build/SpaceMinerGame.exe
          ls -lh build/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMinerGame-Windows-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Android debug signing
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$ANDROID_HOME"
          test -x "$JAVA_HOME/bin/keytool"
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SpaceMinerGame-Android.apk 2>&1 | tee /tmp/godot-android-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-android-export.log; then
            echo "Godot reported errors during Android export."
            exit 1
          fi
          test -s build/SpaceMinerGame-Android.apk
          ls -lh build/SpaceMinerGame-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMinerGame-Android-${{ github.sha }}
          path: build/SpaceMinerGame-Android.apk
          if-no-files-found: error
          retention-days: 14
