name: Windows stutter A/B builds

on:
  push:
    branches:
      - prototype/ship-builder-first-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: godot-4.6.3-windowed
            godot_version: 4.6.3
            exclusive_fullscreen: false
          - label: godot-4.7.1-exclusive
            godot_version: 4.7.1
            exclusive_fullscreen: true
          - label: godot-4.6.3-exclusive
            godot_version: 4.6.3
            exclusive_fullscreen: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure exclusive fullscreen variant
        if: matrix.exclusive_fullscreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('project.godot')
          text = path.read_text(encoding='utf-8')
          marker = '[display]\n'
          if marker not in text:
              raise SystemExit('Missing [display] section')
          if 'window/size/mode=' in text:
              import re
              text = re.sub(r'^window/size/mode=.*$', 'window/size/mode=4', text, flags=re.M)
          else:
              text = text.replace(marker, marker + 'window/size/mode=4\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -A12 '^\[display\]' project.godot

      - name: Install Godot ${{ matrix.godot_version }} and export templates
        shell: bash
        env:
          GODOT_VERSION: ${{ matrix.godot_version }}
        run: |
          set -euxo pipefail
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          curl -L -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/export-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader|SPIR-V compilation failed" /tmp/godot-import.log; then
            echo "Godot reported script or shader compilation errors during import."
            exit 1
          fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 8s godot --headless --path . 2>&1 | tee /tmp/godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-runtime.log; then
            echo "Godot reported script or shader errors while starting the game."
            exit 1
          fi

      - name: Simulation smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 10s godot --headless --path . -- --simulation-smoke 2>&1 | tee /tmp/godot-simulation.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call|Invalid access|Condition .* is true|ERROR:" /tmp/godot-simulation.log; then
            echo "Godot reported errors while exercising the mining simulation."
            exit 1
          fi

      - name: Export Windows executable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/SpaceMinerGame.exe 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-export.log; then
            echo "Godot reported script or shader errors during export."
            exit 1
          fi
          test -s build/SpaceMinerGame.exe
          test "$(find build -maxdepth 1 -type f | wc -l)" -eq 1
          ls -lh build/

      - name: Upload Windows variant
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMinerGame-Windows-${{ matrix.label }}-${{ github.sha }}
          path: build/SpaceMinerGame.exe
          if-no-files-found: error
          retention-days: 14
